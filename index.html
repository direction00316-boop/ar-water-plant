
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>大萍水箱 AR 自然實驗平台</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- =================================
     1. MindAR 與 A-Frame 載入
     ================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/arjs-gestures.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Microsoft JhengHei", sans-serif;
  background: transparent;
}

/* =================================
   2. AR 場景容器
   ================================= */

#ar-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* 讓 MindAR 自行管理相機影片與 AR 畫布 */

a-scene {
  width: 100%;
  height: 100%;
}

/* =================================
   3. 操作說明
   ================================= */

#guide-panel {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  background: rgba(255,255,255,0.93);
  padding: 12px 16px;
  border-radius: 10px;
  z-index: 1000;
  pointer-events: none;
}

#guide-panel h3 {
  margin: 0 0 6px;
  color: #2e7d32;
  font-size: 16px;
}

#guide-panel p {
  margin: 0;
  font-size: 13px;
  color: #333;
  line-height: 1.5;
}

/* =================================
   4. 水位控制
   ================================= */

#water-control-panel {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 12px 20px;
  border-radius: 25px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 82%;
  max-width: 420px;
}

#water-control-panel label {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

#water-control-panel input {
  width: 100%;
}

/* =================================
   5. 學習單按鈕
   ================================= */

#open-sheet-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #0288d1;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-size: 15px;
  font-weight: bold;
  z-index: 1000;
}

/* =================================
   6. 相機啟動提示
   ================================= */

#camera-status {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 86%;
  max-width: 380px;
  padding: 24px;
  border-radius: 14px;
  background: rgba(255,255,255,0.97);
  color: #333;
  text-align: center;
  z-index: 5000;
  box-shadow: 0 5px 25px rgba(0,0,0,0.35);
}

#camera-title {
  margin: 0 0 12px;
  color: #2e7d32;
  font-size: 19px;
}

#camera-message {
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#retry-camera {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: #0288d1;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#retry-camera:disabled {
  opacity: 0.6;
}

/* =================================
   7. 學習單視窗
   ================================= */

#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 10000;
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: white;
  padding: 22px;
  border-radius: 12px;
  width: 90%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
}

.form-item {
  margin-bottom: 14px;
}

.form-item label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
  font-size: 14px;
  color: #333;
}

.form-item input,
.form-item select,
.form-item textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.btn-submit {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 6px;
  width: 100%;
  font-size: 16px;
  font-weight: bold;
}

.btn-close {
  background: #888;
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  float: right;
}
</style>
</head>

<body>

<!-- =================================
     8. AR 場景
     ================================= -->

<div id="ar-container">

  <a-scene
    id="ar-scene"
    embedded
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
    "
    gesture-detector
    color-space="sRGB"
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="20000">

      <a-asset-item
        id="plant-model"
        src="./plant.glb">
      </a-asset-item>

    </a-assets>

    <!-- AR 相機 -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 圖卡辨識 -->

    <a-entity
      id="plant-target"
      mindar-image-target="targetIndex: 0">

      <!-- 模型群組：放大整體水箱 -->

      <a-entity
        id="ar-main-group"
        position="0 0 0.1"
        scale="0.4 0.4 0.4"
        class="clickable"
        gesture-handler="minScale: 0.2; maxScale: 1.2">

        <!-- 透明水箱 -->

        <a-box
          position="0 0 0"
          width="2"
          height="2.5"
          depth="2"
          material="
            color: #e0f7fa;
            transparent: true;
            opacity: 0.25;
            side: double;
          ">
        </a-box>

        <!-- 底層土壤 -->

        <a-box
          position="0 -1.1 0"
          width="1.9"
          height="0.3"
          depth="1.9"
          material="
            color: #4e342e;
            roughness: 0.9;
          ">
        </a-box>

        <!-- 水面 -->

        <a-plane
          id="water-surface"
          position="0 0 0"
          rotation="-90 0 0"
          width="1.9"
          height="1.9"
          material="
            color: #0288d1;
            transparent: true;
            opacity: 0.5;
            side: double;
          ">
        </a-plane>

        <!-- 大萍模型：放大模型本身 -->

        <a-entity
          id="plant-entity"
          gltf-model="#plant-model"
          scale="0.5 0.5 0.5"
          position="0 0 0">
        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

</div>

<!-- =================================
     9. 操作說明
     ================================= -->

<div id="guide-panel">

  <h3>🔬 自然實驗任務：水生植物觀察</h3>

  <p>
    1. 將鏡頭對準圖卡，可以在螢幕上<b>單指滑動旋轉、雙指張開縮放</b>。<br>
    2. 移動下方<b>水位滑桿</b>，觀察大萍隨水面升降、根部懸浮於水中的特點。<br>
    3. 點擊右下角按鈕填寫學習單。
  </p>

</div>

<!-- =================================
     10. 相機啟動提示
     ================================= -->

<div id="camera-status">

  <h3 id="camera-title">📷 大萍 AR 自然實驗</h3>

  <p id="camera-message">
    AR 系統正在準備中。
    請點擊下方按鈕啟動相機。
  </p>

  <button id="retry-camera" type="button">
    📷 點擊啟動相機
  </button>

</div>

<!-- =================================
     11. 水位控制
     ================================= -->

<div id="water-control-panel">

  <label for="waterLevel">水箱水位：</label>

  <input
    type="range"
    id="waterLevel"
    min="1.0"
    max="4.0"
    step="0.1"
    value="2.5">

</div>

<!-- =================================
     12. 學習單按鈕
     ================================= -->

<button id="open-sheet-btn" type="button">
  📝 填寫觀察學習單
</button>

<!-- =================================
     13. 學習單視窗
     ================================= -->

<div id="modal">

  <div class="modal-box">

    <button
      class="btn-close"
      type="button"
      onclick="closeModal()">
      ✕ 關閉
    </button>

    <h3 style="color:#2e7d32; margin-top:0;">
      📝 大萍水生植物觀察學習單
    </h3>

    <form id="reportForm">

      <div class="form-item">

        <label>班級 / 座號：</label>

        <input
          type="text"
          id="studentId"
          placeholder="例：50108"
          required>

      </div>

      <div class="form-item">

        <label>學生姓名：</label>

        <input
          type="text"
          id="studentName"
          placeholder="請輸入姓名"
          required>

      </div>

      <div class="form-item">

        <label>
          1. 當調高或調低水箱水位時，大萍的莖、葉與懸浮氣根有何變化？
        </label>

        <textarea
          id="waterObs"
          rows="3"
          placeholder="請描述觀察結果..."
          required></textarea>

      </div>

      <div class="form-item">

        <label>
          2. 根據觀察，你判斷大萍是屬於哪一類水生植物？
        </label>

        <select id="plantType" required>

          <option value="">-- 請選擇植物類型 --</option>
          <option value="漂浮性">漂浮性水生植物</option>
          <option value="挺水性">挺水性水生植物</option>
          <option value="浮葉性">浮葉性水生植物</option>
          <option value="沉水性">沉水性水生植物</option>

        </select>

      </div>

      <div class="form-item">

        <label>
          3. 請寫出你做出上述判斷的原因與依據：
        </label>

        <textarea
          id="reason"
          rows="3"
          placeholder="請說明判斷依據..."
          required></textarea>

      </div>

      <button
        type="button"
        class="btn-submit"
        id="submit-button"
        onclick="submitForm()">

        提送學習單至老師試算表

      </button>

    </form>

  </div>

</div>

<!-- =================================
     14. JavaScript
     ================================= -->

<script>

/* =================================
   A. 取得網頁元素
   ================================= */

const sceneEl = document.getElementById("ar-scene");

const cameraStatus = document.getElementById("camera-status");
const cameraTitle = document.getElementById("camera-title");
const cameraMessage = document.getElementById("camera-message");
const retryButton = document.getElementById("retry-camera");

const targetEl = document.getElementById("plant-target");
const plantEntity = document.getElementById("plant-entity");
const waterSurface = document.getElementById("water-surface");

let sceneReady = false;
let arStarting = false;
let arReady = false;
let startTimer = null;


/* =================================
   B. 狀態提示
   ================================= */

function showStatus(title, message, showButton = false) {

  cameraStatus.style.display = "block";

  cameraTitle.textContent = title;

  cameraMessage.textContent = message;

  retryButton.style.display = showButton ? "block" : "none";

}

function hideStatus() {

  cameraStatus.style.display = "none";

}

function resetStart() {

  arStarting = false;

  retryButton.disabled = false;

  if (startTimer) {

    clearTimeout(startTimer);

    startTimer = null;

  }

}


/* =================================
   C. 取得 MindAR 系統
   ================================= */

function getARSystem() {

  if (!window.AFRAME) {

    throw new Error("A-Frame 尚未載入。");

  }

  if (!sceneEl) {

    throw new Error("找不到 AR 場景。");

  }

  const systems = sceneEl.systems || {};

  const system = systems["mindar-image-system"];

  if (!system || typeof system.start !== "function") {

    throw new Error(
      "找不到 MindAR 啟動系統，請檢查 MindAR 整合檔案。"
    );

  }

  return system;

}


/* =================================
   D. AR 啟動
   ================================= */

async function startAR() {

  if (arStarting || arReady) return;

  if (!sceneReady) {

    showStatus(
      "⏳ AR 系統載入中",
      "場景尚未完成初始化，請稍候。",
      true
    );

    return;

  }

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "⚠️ 無法使用相機",
      "請使用 HTTPS 網址及支援相機功能的 Safari 瀏覽器。",
      true
    );

    return;

  }

  let arSystem;

  try {

    arSystem = getARSystem();

  } catch (error) {

    console.error("[MindAR 系統錯誤]", error);

    showStatus(
      "⚠️ MindAR 初始化失敗",
      error.message,
      true
    );

    return;

  }

  arStarting = true;

  retryButton.disabled = true;

  showStatus(
    "📷 正在啟動相機",
    "請允許 Safari 使用相機，並稍候畫面載入。"
  );

  console.log("[AR] 開始啟動 MindAR。");

  /*
    設定啟動逾時監測。
  */

  startTimer = setTimeout(function() {

    if (!arReady) {

      resetStart();

      showStatus(
        "⚠️ AR 啟動逾時",
        "25 秒內沒有收到 arReady 事件。\n" +
        "請重新整理網頁後再次測試。",
        true
      );

    }

  }, 25000);

  try {

    /*
      由使用者點擊按鈕直接啟動 AR。
    */

    const result = arSystem.start();

    if (result && typeof result.then === "function") {

      await result;

    }

    console.log("[AR] MindAR start() 已執行。");

  } catch (error) {

    console.error("[AR 啟動失敗]", error);

    resetStart();

    showStatus(
      "⚠️ 相機啟動失敗",
      "錯誤名稱：" + (error.name || "未知") +
      "\n錯誤訊息：" + (error.message || String(error)),
      true
    );

  }

}


/* =================================
   E. AR 場景初始化
   ================================= */

function initializeAR() {

  if (sceneReady) return;

  sceneReady = true;

  console.log("[AR] A-Frame 場景載入完成。");

  try {

    getARSystem();

    showStatus(
      "📷 AR 系統準備完成",
      "請點擊下方按鈕啟動相機。",
      true
    );

  } catch (error) {

    console.error("[AR 初始化檢查失敗]", error);

    showStatus(
      "⚠️ AR 系統載入失敗",
      error.message,
      true
    );

  }

}

sceneEl.addEventListener("loaded", initializeAR);

if (sceneEl.hasLoaded) {

  initializeAR();

}


/* =================================
   F. AR 成功事件
   ================================= */

sceneEl.addEventListener("arReady", function() {

  console.log("[AR] 收到 arReady 事件。");

  arReady = true;

  resetStart();

  showStatus(
    "✅ 相機啟動成功",
    "請將鏡頭對準大萍 AR 圖卡。"
  );

  setTimeout(function() {

    hideStatus();

  }, 2500);

});


/* =================================
   G. AR 錯誤事件
   ================================= */

sceneEl.addEventListener("arError", function(event) {

  console.error("[AR 錯誤事件]", event);

  if (arReady) return;

  resetStart();

  let detail = "請檢查相機權限、圖卡檔案及網路連線。";

  if (event.detail) {

    detail =
      event.detail.message ||
      JSON.stringify(event.detail);

  }

  showStatus(
    "⚠️ AR 啟動失敗",
    detail,
    true
  );

});


/* =================================
   H. 手動啟動按鈕
   ================================= */

retryButton.addEventListener("click", function(event) {

  event.preventDefault();

  if (arReady || arStarting) return;

  startAR();

});


/* =================================
   I. 圖卡辨識事件
   ================================= */

targetEl.addEventListener("targetFound", function() {

  console.log("[AR] 成功辨識大萍圖卡。");

});

targetEl.addEventListener("targetLost", function() {

  console.log("[AR] 圖卡離開鏡頭。");

});


/* =================================
   J. 大萍模型載入狀態
   ================================= */

plantEntity.addEventListener("model-loaded", function() {

  console.log("[模型] 大萍 GLB 模型載入成功。");

});

plantEntity.addEventListener("model-error", function(event) {

  console.error("[模型] 大萍 GLB 模型載入失敗。", event);

});


/* =================================
   K. 水位控制
   ================================= */

const waterLevelInput = document.getElementById("waterLevel");

waterLevelInput.addEventListener("input", function(event) {

  const level = parseFloat(event.target.value);

  const yPos = (level - 2.5) * 0.5;

  waterSurface.setAttribute(
    "position",
    `0 ${yPos} 0`
  );

  plantEntity.setAttribute(
    "position",
    `0 ${yPos} 0`
  );

});


/* =================================
   L. 學習單視窗
   ================================= */

const modal = document.getElementById("modal");

document.getElementById("open-sheet-btn").onclick = function() {

  modal.style.display = "flex";

};

function closeModal() {

  modal.style.display = "none";

}


/* =================================
   M. Google Sheets 提交
   ================================= */

async function submitForm() {

  const studentId =
    document.getElementById("studentId").value.trim();

  const studentName =
    document.getElementById("studentName").value.trim();

  const waterObs =
    document.getElementById("waterObs").value.trim();

  const plantType =
    document.getElementById("plantType").value;

  const reason =
    document.getElementById("reason").value.trim();

  if (
    !studentId ||
    !studentName ||
    !waterObs ||
    !plantType ||
    !reason
  ) {

    alert("請完整填寫所有學習單內容！");

    return;

  }

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzU0bHeYP-9KeDhbGHaaNPJclP2iwQLOUVRDAJApfINpg_B4_Idm1oDEuNDu_DaXCxp/exec";

  const payload = {

    studentId: studentId,

    studentName: studentName,

    waterObs: waterObs,

    plantType: plantType,

    reason: reason

  };

  const submitButton = document.getElementById("submit-button");

  submitButton.disabled = true;

  submitButton.textContent = "資料送出中……";

  try {

    await fetch(GAS_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },

      body: JSON.stringify(payload)

    });

    /*
      no-cors 模式無法讀取伺服器回傳內容，
      因此不能僅憑 fetch 完成就確認試算表已寫入。
    */

    alert(
      "已送出資料請求。\n" +
      "請老師確認 Google Sheets 是否收到資料。"
    );

    closeModal();

    document.getElementById("reportForm").reset();

  } catch (error) {

    console.error("[學習單提交失敗]", error);

    alert(
      "提交失敗，請檢查網路連線。"
    );

  } finally {

    submitButton.disabled = false;

    submitButton.textContent = "提送學習單至老師試算表";

  }

}


/* =================================
   N. 頁面錯誤監測
   ================================= */

window.addEventListener("error", function(event) {

  console.error(
    "[網頁 JavaScript 錯誤]",
    event.message,
    event.filename,
    event.lineno
  );

});

window.addEventListener("unhandledrejection", function(event) {

  console.error(
    "[未處理的 Promise 錯誤]",
    event.reason
  );

});

console.log("[AR] 網頁程式初始化完成。");

</script>

</body>
</html>
