
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>大萍水箱 AR 自然實驗平台</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- 手勢控制 -->
  <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/arjs-gestures.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #guide-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(255,255,255,0.93);
      padding: 12px 16px;
      border-radius: 10px;
      z-index: 1000;
      pointer-events: none;
    }

    #guide-panel h3 {
      margin: 0 0 6px;
      color: #2e7d32;
      font-size: 16px;
    }

    #guide-panel p {
      margin: 0;
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }

    #water-control-panel {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 82%;
      max-width: 420px;
    }

    #water-control-panel label {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    #water-control-panel input {
      width: 100%;
    }

    #open-sheet-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0288d1;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      z-index: 1000;
    }

    /* 相機啟動提示 */
    #camera-status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86%;
      max-width: 380px;
      padding: 24px;
      border-radius: 14px;
      background: rgba(255,255,255,0.97);
      color: #333;
      text-align: center;
      z-index: 5000;
      box-shadow: 0 5px 25px rgba(0,0,0,0.35);
      pointer-events: auto;
    }

    #camera-title {
      margin: 0 0 12px;
      color: #2e7d32;
      font-size: 19px;
    }

    #camera-message {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #retry-camera {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #0288d1;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #retry-camera:disabled {
      background: #888;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: white;
      padding: 22px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-item {
      margin-bottom: 14px;
    }

    .form-item label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
    }

    .form-item input,
    .form-item select,
    .form-item textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-submit {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }

    .btn-close {
      background: #888;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      float: right;
    }
  </style>
</head>

<body>

  <!-- 操作說明 -->
  <div id="guide-panel">
    <h3>🔬 自然實驗任務：水生植物觀察</h3>
    <p>
      1. 將鏡頭對準圖卡，可以在螢幕上<b>單指滑動旋轉、雙指張開縮放</b>。<br>
      2. 移動下方<b>水位滑桿</b>，觀察大萍隨水面升降、根部懸浮於水中的特點。<br>
      3. 點擊右下角按鈕填寫學習單。
    </p>
  </div>

  <!-- 相機狀態視窗 -->
  <div id="camera-status">
    <h3 id="camera-title">📷 正在準備 AR 相機</h3>

    <p id="camera-message">
      正在載入 AR 系統，請稍候。
    </p>

    <button id="retry-camera" type="button">
      📷 點擊啟動相機
    </button>
  </div>

  <!-- 水位控制 -->
  <div id="water-control-panel">
    <label for="waterLevel">水箱水位：</label>
    <input
      type="range"
      id="waterLevel"
      min="1.0"
      max="4.0"
      step="0.1"
      value="2.5">
  </div>

  <!-- 學習單按鈕 -->
  <button id="open-sheet-btn" type="button">
    📝 填寫觀察學習單
  </button>

  <!-- AR 場景 -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
    "
    gesture-detector
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="plant-model"
        src="./plant.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 圖卡辨識 -->
    <a-entity
      id="plant-target"
      mindar-image-target="targetIndex: 0">

      <a-entity
        id="ar-main-group"
        position="0 0 -0.2"
        scale="0.015 0.015 0.015"
        class="clickable"
        gesture-handler="minScale: 0.005; maxScale: 0.1">

        <!-- 透明水箱 -->
        <a-box
          position="0 0 0"
          width="2"
          height="2.5"
          depth="2"
          material="
            color: #e0f7fa;
            transparent: true;
            opacity: 0.25;
            side: double">
        </a-box>

        <!-- 底層土壤 -->
        <a-box
          position="0 -1.1 0"
          width="1.9"
          height="0.3"
          depth="1.9"
          material="
            color: #4e342e;
            roughness: 0.9">
        </a-box>

        <!-- 水面 -->
        <a-plane
          id="water-surface"
          position="0 0 0"
          rotation="-90 0 0"
          width="1.9"
          height="1.9"
          material="
            color: #0288d1;
            transparent: true;
            opacity: 0.5;
            side: double">
        </a-plane>

        <!-- 大萍模型 -->
        <a-entity
          id="plant-entity"
          gltf-model="#plant-model"
          scale="0.25 0.25 0.25"
          position="0 0 0">
        </a-entity>

      </a-entity>
    </a-entity>

  </a-scene>

  <!-- 學習單 -->
  <div id="modal">
    <div class="modal-box">

      <button class="btn-close" onclick="closeModal()">
        ✕ 關閉
      </button>

      <h3 style="color:#2e7d32; margin-top:0;">
        📝 大萍水生植物觀察學習單
      </h3>

      <form id="reportForm">

        <div class="form-item">
          <label>班級 / 座號：</label>
          <input
            type="text"
            id="studentId"
            placeholder="例：50108"
            required>
        </div>

        <div class="form-item">
          <label>學生姓名：</label>
          <input
            type="text"
            id="studentName"
            placeholder="請輸入姓名"
            required>
        </div>

        <div class="form-item">
          <label>
            1. 當調高或調低水箱水位時，大萍的莖、葉與懸浮氣根有何變化？
          </label>

          <textarea
            id="waterObs"
            rows="3"
            placeholder="請描述觀察結果..."
            required></textarea>
        </div>

        <div class="form-item">
          <label>
            2. 根據觀察，你判斷大萍是屬於哪一類水生植物？
          </label>

          <select id="plantType" required>
            <option value="">-- 請選擇植物類型 --</option>
            <option value="漂浮性">漂浮性水生植物</option>
            <option value="挺水性">挺水性水生植物</option>
            <option value="浮葉性">浮葉性水生植物</option>
            <option value="沉水性">沉水性水生植物</option>
          </select>
        </div>

        <div class="form-item">
          <label>
            3. 請寫出你做出上述判斷的原因與依據：
          </label>

          <textarea
            id="reason"
            rows="3"
            placeholder="請說明判斷依據..."
            required></textarea>
        </div>

        <button
          type="button"
          class="btn-submit"
          onclick="submitForm()">
          提送學習單至老師試算表
        </button>

      </form>
    </div>
  </div>


  <script>

    // ==========================================
    // 1. 取得網頁元素
    // ==========================================

    const sceneEl = document.querySelector("a-scene");

    const cameraStatus =
      document.getElementById("camera-status");

    const cameraTitle =
      document.getElementById("camera-title");

    const cameraMessage =
      document.getElementById("camera-message");

    const retryButton =
      document.getElementById("retry-camera");

    const targetEl =
      document.getElementById("plant-target");


    // ==========================================
    // 2. 相機狀態
    // ==========================================

    let sceneReady = false;
    let arReady = false;
    let starting = false;
    let startTimer = null;
    let attemptNumber = 0;

    function showStatus(title, message, showButton = false) {

      cameraStatus.style.display = "block";

      cameraTitle.textContent = title;

      cameraMessage.textContent = message;

      retryButton.style.display =
        showButton ? "block" : "none";

    }

    function hideStatus() {

      cameraStatus.style.display = "none";

    }

    function resetStartState() {

      starting = false;

      retryButton.disabled = false;

      if (startTimer) {
        clearTimeout(startTimer);
        startTimer = null;
      }

    }


    // ==========================================
    // 3. 顯示環境檢查
    // ==========================================

    function checkCameraEnvironment() {

      if (!window.isSecureContext) {

        showStatus(
          "⚠️ 網站安全連線問題",
          "請使用 HTTPS 的 GitHub Pages 網址開啟網站。",
          true
        );

        return false;

      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {

        showStatus(
          "⚠️ 瀏覽器不支援相機功能",
          "目前瀏覽器無法使用相機 API，請使用 iPad Safari 開啟網站。",
          true
        );

        return false;

      }

      return true;

    }


    // ==========================================
    // 4. 啟動 MindAR
    // ==========================================

    function startAR() {

      if (arReady || starting) {
        return;
      }

      if (!sceneReady) {

        showStatus(
          "⏳ AR 系統尚未準備完成",
          "請稍候幾秒，再點擊啟動相機。",
          true
        );

        return;

      }

      if (!checkCameraEnvironment()) {
        return;
      }

      const arSystem =
        sceneEl.systems["mindar-image-system"];

      if (!arSystem || typeof arSystem.start !== "function") {

        showStatus(
          "⚠️ 找不到 AR 啟動系統",
          "MindAR 尚未正確載入，請重新整理網頁後再試。",
          true
        );

        return;

      }

      starting = true;
      attemptNumber++;

      const currentAttempt = attemptNumber;

      retryButton.disabled = true;

      retryButton.style.display = "none";

      showStatus(
        "📷 正在開啟相機",
        "請允許 Safari 使用相機，並稍候畫面載入..."
      );

      console.log("開始啟動 MindAR，第", currentAttempt, "次");

      try {

        // 重要：直接呼叫 start，不使用 await
        // 讓按鈕點擊事件能直接觸發相機啟動

        const result = arSystem.start();

        // 如果 start() 回傳 Promise，監聽其錯誤
        if (result && typeof result.catch === "function") {

          result.catch(function(error) {

            console.error("MindAR start Promise 錯誤：", error);

            if (!arReady && currentAttempt === attemptNumber) {

              resetStartState();

              showStatus(
                "⚠️ 相機啟動失敗",
                "錯誤資訊：" + (error.message || String(error)),
                true
              );

            }

          });

        }

        // 15 秒仍未成功，提供重新啟動按鈕
        startTimer = setTimeout(function() {

          if (!arReady && currentAttempt === attemptNumber) {

            resetStartState();

            showStatus(
              "⚠️ 相機啟動逾時",
              "相機尚未成功啟動。請檢查 Safari 權限、網路及 targets.mind，再重新嘗試。",
              true
            );

          }

        }, 15000);

      } catch (error) {

        console.error("啟動相機發生錯誤：", error);

        resetStartState();

        showStatus(
          "⚠️ 無法啟動相機",
          "錯誤資訊：" + (error.message || String(error)),
          true
        );

      }

    }


    // ==========================================
    // 5. AR 場景載入完成
    // ==========================================

    function onSceneLoaded() {

      if (sceneReady) return;

      sceneReady = true;

      console.log("A-Frame 場景載入完成");

      showStatus(
        "📷 正在準備相機",
        "AR 系統已載入，正在嘗試開啟後置鏡頭..."
      );

      // 自動嘗試啟動
      // 若 Safari 要求使用者操作，則改按下方按鈕
      setTimeout(function() {

        startAR();

      }, 800);

    }

    sceneEl.addEventListener("loaded", onSceneLoaded);

    // 避免程式執行時場景已經載入完成
    if (sceneEl.hasLoaded) {
      onSceneLoaded();
    }


    // ==========================================
    // 6. AR 成功啟動
    // ==========================================

    sceneEl.addEventListener("arReady", function() {

      console.log("MindAR 相機啟動成功");

      arReady = true;

      resetStartState();

      showStatus(
        "✅ 相機啟動成功",
        "請將鏡頭對準大萍 AR 圖卡。"
      );

      setTimeout(function() {

        if (arReady) {
          hideStatus();
        }

      }, 1800);

    });


    // ==========================================
    // 7. AR 啟動失敗
    // ==========================================

    sceneEl.addEventListener("arError", function(event) {

      console.error("MindAR arError：", event);

      if (arReady) return;

      resetStartState();

      let detail = "";

      if (event.detail) {

        if (event.detail.message) {
          detail = event.detail.message;
        } else {
          detail = String(event.detail);
        }

      }

      showStatus(
        "⚠️ 相機無法啟動",
        "MindAR 啟動失敗。\n" +
        (detail ? "錯誤資訊：" + detail + "\n" : "") +
        "請確認 Safari 相機權限，再點擊下方按鈕。",
        true
      );

    });


    // ==========================================
    // 8. 手動啟動按鈕
    // ==========================================

    retryButton.addEventListener("click", function(event) {

      event.preventDefault();

      console.log("使用者點擊啟動相機");

      if (arReady || starting) {
        return;
      }

      // 這裡直接呼叫 startAR
      // 不使用 setTimeout 包住啟動動作，
      // 保留使用者點擊所提供的操作時機

      startAR();

    });


    // ==========================================
    // 9. 圖卡辨識事件
    // ==========================================

    targetEl.addEventListener("targetFound", function() {

      console.log("成功辨識大萍 AR 圖卡");

    });

    targetEl.addEventListener("targetLost", function() {

      console.log("圖卡離開鏡頭");

    });


    // ==========================================
    // 10. 水位控制
    // ==========================================

    const waterLevelInput =
      document.getElementById("waterLevel");

    const waterSurface =
      document.getElementById("water-surface");

    const plantEntity =
      document.getElementById("plant-entity");

    waterLevelInput.addEventListener("input", function(e) {

      const level = parseFloat(e.target.value);

      const yPos = (level - 2.5) * 0.5;

      waterSurface.setAttribute(
        "position",
        `0 ${yPos} 0`
      );

      plantEntity.setAttribute(
        "position",
        `0 ${yPos} 0`
      );

    });


    // ==========================================
    // 11. 學習單視窗
    // ==========================================

    const modal =
      document.getElementById("modal");

    document.getElementById("open-sheet-btn").onclick =
      function() {

        modal.style.display = "flex";

      };

    function closeModal() {

      modal.style.display = "none";

    }


    // ==========================================
    // 12. Google Sheets 學習單提交
    // ==========================================

    async function submitForm() {

      const studentId =
        document.getElementById("studentId").value.trim();

      const studentName =
        document.getElementById("studentName").value.trim();

      const waterObs =
        document.getElementById("waterObs").value.trim();

      const plantType =
        document.getElementById("plantType").value;

      const reason =
        document.getElementById("reason").value.trim();


      if (
        !studentId ||
        !studentName ||
        !waterObs ||
        !plantType ||
        !reason
      ) {

        alert("請完整填寫所有學習單內容！");

        return;

      }


      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbzU0bHeYP-9KeDhbGHaaNPJclP2iwQLOUVRDAJApfINpg_B4_Idm1oDEuNDu_DaXCxp/exec";


      const payload = {

        studentId,
        studentName,
        waterObs,
        plantType,
        reason

      };


      try {

        await fetch(GAS_URL, {

          method: "POST",
          mode: "no-cors",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(payload)

        });

        alert(
          "已送出學習單，請老師確認試算表資料。"
        );

        closeModal();

        document.getElementById("reportForm").reset();

      } catch (error) {

        console.error("學習單提交錯誤：", error);

        alert("提交失敗，請檢查網路連線。");

      }

    }

  </script>

</body>
</html>
